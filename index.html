<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congratulations Graduate!</title>
<!-- To use a different font: swap this Google Fonts link for the one you want,
     then update --font-en / --font-ar below to match its font-family name. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* English headings / English body font — change these to switch fonts */
    --font-heading: 'Playfair Display', 'Georgia', serif;
    --font-body: 'Lora', 'Georgia', serif;
    /* Arabic font (used automatically when a message is written in Arabic) */
    --font-ar: 'Cairo', 'Tahoma', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    background: linear-gradient(180deg, #0d1b3e 0%, #16264d 55%, #1f3059 100%);
    padding: 20px;
    position: relative;
  }

  #balloons {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .balloon {
    position: absolute;
    bottom: -220px;
    width: 90px;
    height: 112px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.55));
  }

  .balloon::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 20px;
    width: 20px;
    height: 26px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
  }

  .balloon::after {
    content: '';
    position: absolute;
    bottom: -60px;
    left: 50%;
    width: 1px;
    height: 60px;
    background: rgba(255,255,255,0.4);
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.9; }
    50%  { transform: translateY(-58vh) translateX(24px) rotate(4deg); }
    100% { transform: translateY(-118vh) translateX(-16px) rotate(-4deg); opacity: 0; }
  }

  #fireworks-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  #confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  .card {
    background: #fffdf7;
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(212,175,55,0.15);
    position: relative;
    border: 3px solid #d4af37;
    z-index: 4;
    opacity: 0;
    transform: scale(0.85) translateY(20px);
    animation: cardPopIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
  }

  @keyframes cardPopIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .cap {
    font-size: 52px;
    margin-bottom: 8px;
    display: inline-block;
    animation: capBounce 2.4s ease-in-out infinite;
    animation-delay: 1.1s;
  }

  @keyframes capBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-10px) rotate(-8deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-6px) rotate(8deg); }
  }

  .photo {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #d4af37;
    margin: 0 auto 12px;
    display: block;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.4s forwards;
  }

  .title {
    font-family: var(--font-heading);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #b8862f;
    margin-bottom: 8px;
    font-weight: 700;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.6s forwards;
  }

  .name {
    font-family: var(--font-heading);
    font-size: 28px;
    color: #1a1a3d;
    margin: 8px 0 20px;
    font-weight: 700;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.8s forwards;
  }

  .verse {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 14px;
    color: #7a6a3f;
    background: #fbf6e8;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 0 0 20px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 0.9s forwards;
  }

  [dir="rtl"] .verse,
  [dir="rtl"] .message {
    font-family: var(--font-ar);
    font-style: normal;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
    margin: 0 auto 24px;
    border-radius: 2px;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 1s forwards;
  }

  .message {
    font-size: 17px;
    line-height: 1.7;
    color: #333;
    white-space: pre-wrap;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 1.2s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .footer {
    margin-top: 28px;
    font-size: 13px;
    color: #999;
    font-style: italic;
    opacity: 0;
    animation: fadeUp 0.7s ease-out 1.4s forwards;
  }

  .sparkle {
    position: absolute;
    font-size: 20px;
    animation: sparkleFloat 3s ease-in-out infinite;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.1); }
  }

  .error {
    color: #a33;
    font-size: 16px;
  }
  .loading {
    color: #999;
    font-size: 16px;
  }
</style>
</head>
<body>
  <div id="balloons"></div>
  <canvas id="fireworks-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>

  <div class="card" id="card">
    <div class="cap">🎓</div>
    <div class="title">Congratulations</div>
    <div id="content" class="loading">Loading your message...</div>
  </div>

<script>
/* ---------- Message loading ---------- */
async function loadMessage() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const content = document.getElementById('content');

  if (!id) {
    content.innerHTML = '<div class="error">No graduate ID provided in the link.</div>';
    return;
  }

  try {
    const res = await fetch('messages.json');
    const data = await res.json();
    const person = data[id];

    if (!person) {
      content.innerHTML = '<div class="error">We couldn\'t find a message for this link.</div>';
      return;
    }

    // If the message contains Arabic characters, switch that text to right-to-left
    const arabicPattern = /[\u0600-\u06FF]/;
    if (arabicPattern.test(person.message)) {
      content.setAttribute('dir', 'rtl');
    }

    const photoHtml = person.photo
      ? `<img class="photo" src="${person.photo}" alt="${person.name}">`
      : '';
    const verseHtml = person.verse
      ? `<div class="verse">${person.verse}</div>`
      : '';

    content.innerHTML = `
      ${photoHtml}
      <div class="name">${person.name}</div>
      <div class="divider"></div>
      ${verseHtml}
      <div class="message">${person.message}</div>
      <div class="footer">${person.signature || ''}</div>
    `;
  } catch (e) {
    content.innerHTML = '<div class="error">Something went wrong loading your message.</div>';
  }
}
loadMessage();

/* ---------- Floating balloons rising from the bottom ---------- */
(function balloons() {
  const container = document.getElementById('balloons');
  const gold = '#e8c14a';
  const count = 7;

  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    const size = 46 + Math.random() * 20;
    const duration = 16 + Math.random() * 10;
    const delay = -Math.random() * duration;

    b.style.left = (Math.random() * 88) + '%';
    b.style.width = size + 'px';
    b.style.height = (size * 1.25) + 'px';
    b.style.background = `radial-gradient(circle at 30% 25%, #ffe27a, ${gold} 60%, #b8912a 100%)`;
    b.style.animationDuration = duration + 's';
    b.style.animationDelay = delay + 's';

    container.appendChild(b);
  }
})();

/* ---------- Fireworks (canvas particle bursts) ---------- */
(function fireworksEngine() {
  const canvas = document.getElementById('fireworks-canvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#a78bfa', '#f472b6', '#fbbf24', '#60a5fa'];
  let particles = [];

  function launchFirework(x, y) {
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 55;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = 2 + Math.random() * 3.5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color,
        size: 2 + Math.random() * 2,
        gravity: 0.045,
        decay: 0.012 + Math.random() * 0.012
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.alpha -= p.decay;
      if (p.alpha > 0) {
        ctx.beginPath();
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.fillStyle = p.color;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    particles = particles.filter(p => p.alpha > 0);
    requestAnimationFrame(animate);
  }
  animate();

  // Launch a celebratory burst sequence when the page opens
  const launchPoints = 6;
  for (let i = 0; i < launchPoints; i++) {
    setTimeout(() => {
      const x = w * (0.2 + Math.random() * 0.6);
      const y = h * (0.15 + Math.random() * 0.35);
      launchFirework(x, y);
    }, 300 + i * 550);
  }

  // Occasional gentle fireworks afterward so it stays alive but not distracting
  setInterval(() => {
    if (Math.random() < 0.5) {
      const x = w * (0.15 + Math.random() * 0.7);
      const y = h * (0.1 + Math.random() * 0.35);
      launchFirework(x, y);
    }
  }, 4500);
})();

/* ---------- Falling confetti ---------- */
(function confettiEngine() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#d4af37', '#ff6b6b', '#4ecdc4', '#a78bfa', '#f472b6', '#60a5fa', '#fbbf24'];
  const pieces = [];
  const total = 90;

  for (let i = 0; i < total; i++) {
    pieces.push({
      x: Math.random() * w,
      y: -Math.random() * h,
      size: 5 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: 1 + Math.random() * 2,
      speedX: (Math.random() - 0.5) * 1.5,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 6,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    pieces.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotationSpeed;
      if (p.y > h + 20) {
        p.y = -20;
        p.x = Math.random() * w;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---------- Sparkle emojis around the card ---------- */
(function sparkles() {
  const card = document.getElementById('card');
  const emojis = ['✨', '🎉', '⭐', '🎊'];
  setTimeout(() => {
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 2) + 's';
      card.appendChild(s);
    }
  }, 900);
})();
</script>
</body>
</html>
